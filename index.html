<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>vue-signature</title>
  </head>
  <body>
    <main id="app">
      <h1>vue-signature</h1>
      <div :style="{ width: width + 'px', maxWidth: '100%', height: '200px', border: '1px solid #999' }">
        <vue-signature ref="signature" :disabled="disabled" v-on="{ endStroke: updateStatus }"></vue-signature>
      </div>
      <p role="status">{{ status }}</p>
      <button @click="clear">Clear</button>
      <button @click="undo">Undo</button>
      <button @click="resize">Resize</button>
      <button @click="disabled = !disabled">{{ disabled ? 'Enable drawing' : 'Disable drawing' }}</button>
      <button @click="save">Save PNG</button>
      <button @click="loadSvg">Load SVG</button>
      <p v-if="preview"><img :src="preview" alt="Saved signature" style="max-width: 100%"></p>
    </main>
    <script src="/vendor/vue/vue.js"></script>
    <script src="/dist/vue-signature.js"></script>
    <script>
      new Vue({
        el: '#app',
        components: { vueSignature: window.vueSignature },
        data: { width: 500, disabled: false, status: 'Ready', preview: '' },
        methods: {
          updateStatus() { this.status = this.$refs.signature.isEmpty() ? 'Empty' : 'Signature present' },
          clear() { this.$refs.signature.clear(); this.updateStatus() },
          undo() { this.$refs.signature.undo(); this.updateStatus() },
          resize() { this.width = this.width === 500 ? 350 : 500 },
          save() { this.preview = this.$refs.signature.save() },
          async loadSvg() {
            const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="500" height="200"><path d="M30 140 Q100 10 150 130 T290 100" fill="none" stroke="black" stroke-width="3"/></svg>'
            try {
              await this.$refs.signature.fromDataURL('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg))
              this.updateStatus()
            } catch (error) { this.status = error.message }
          }
        }
      })
    </script>
  </body>
</html>
